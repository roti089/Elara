<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div id="logo-container">
    <img src="Elara logo.png" id="logo" alt="Elara">
    <h1 id="logo-name">Elara</h1>
<nav id="nav-container">
    <a href="Homepage.html">Home</a>
    <a href="About.html">About </a>
    <a href="Contactus.html">Contact </a>
    <a href="Loginpage.html">Log In</a>
</nav>
</div>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="signup-form">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" id="signupGoogleBtn" class="icon">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#" id="signupFacebookBtn" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" id="signupGithubBtn" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" id="signupLinkedinBtn" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" id="signup-name" placeholder="Name">
                <input type="email" id="signup-email" placeholder="Email">
                <input type="password" id="signup-password" placeholder="Password">
                <button id="register" class="signup-btn">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="signin-form">
                <h1>Sign In</h1>
               <div class="social-icons">
                    <a href="#" id="signinGoogleBtn" class="icon">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#" id="signinFacebookBtn" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" id="signinGithubBtn" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" id="signinLinkedinBtn" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>
                <span>or use your email password</span>
                <input type="email" id="signin-email" placeholder="Email">
                <input type="password" id="signin-password" placeholder="Password">
                <a href="#" id="forgot-link">Forget Your Password?</a>
                <button id="login" class="signin-btn">Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
        
                    <button class="hidden" id="show-login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="show-register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="ui.js"></script>
    <script type="module" src="Login.js"></script>
</body>
</html>
