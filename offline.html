<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0d1a">
    <title>Offline | Elara</title>
    <link rel="icon" href="favicon.ico">
    <style>
        body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#090913; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
        img{ width:96px; border-radius:22px; }
        h1{ font-size:24px; margin:18px 0 8px; }
        p{ color:#a7b2d1; max-width:340px; line-height:1.5; margin:0 auto 22px; }
        button{ border:none; border-radius:14px; padding:13px 26px; font:inherit; font-weight:600; color:#fff; background:linear-gradient(135deg,#7C6CFF,#5F72FF); cursor:pointer; }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Elara needs the internet to load this page. Pages you opened before still work, and changes you make are saved and sent when you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
